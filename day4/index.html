<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuickNotes Draft | Day 4</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes Draft</h1>
      <p>Write a note. It is saved as a draft while you type.</p>
    </header>

    <main>
      <section>
        <label for="note-text">Your note</label>
        <textarea
          id="note-text"
          rows="8"
          placeholder="Start typing your note here..."
        ></textarea>

        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>

        <div class="actions">
          <button id="clear-btn" type="button">Clear</button>
          <button id="theme-toggle" type="button">Dark mode</button>
        </div>
        <p class="hint">Tip: press Escape inside the note to clear it.</p>
      </section>
    </main>

    <footer>
      <p>Day 4 &middot; QuickNotes</p>
    </footer>
  </body>
</html>
